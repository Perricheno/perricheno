services:
  perricheno-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perricheno-site
    restart: always
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - R_COMPILER_URL=http://r-compiler:8000
      - PYTHON_COMPILER_URL=http://python-compiler:8000
    env_file:
      - .env
    volumes:
      - db-data:/app/db
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cloudflare
    depends_on:
      r-compiler:
        condition: service_healthy
      python-compiler:
        condition: service_healthy

  r-compiler:
    build:
      context: ./r-compiler
      dockerfile: Dockerfile
    container_name: r-compiler
    restart: always
    # NO ports exposed — internal only via Docker network
    healthcheck:
      test: [ "CMD", "Rscript", "-e", "tryCatch(readLines(url('http://127.0.0.1:8000/health')), error=function(e) quit(status=1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cloudflare

  python-compiler:
    build:
      context: ./python-compiler
      dockerfile: Dockerfile
    container_name: python-compiler
    restart: always
    # NO ports exposed — internal only via Docker network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - cloudflare

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    restart: always
    env_file:
      - .env
    ports:
      - "3033:3001"
    environment:
      - SITE_INTERNAL_URL=http://perricheno-site:3000
      - BOT_PORT=3001
    healthcheck:
      test: [ "CMD", "pgrep", "-f", "node dist/bot.js" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cloudflare

volumes:
  db-data:

networks:
  cloudflare:
    external: true

