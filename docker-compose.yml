services:
  perricheno-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perricheno-site
    restart: always
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cloudflare

networks:
  cloudflare:
    external: true
