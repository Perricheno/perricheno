services:
  perricheno-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time - see Dockerfile.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    image: perricheno-site:latest
    container_name: perricheno-site
    restart: always
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-perricheno}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres-db:5432/${POSTGRES_DB:-perricheno_db}?schema=public
      - NODE_ENV=production
      - R_COMPILER_URL=http://r-compiler:8000
      - PYTHON_COMPILER_URL=http://python-compiler:8000
      - RESEARCH_API_URL=http://research-api:8080
      - PDF_EXTRACTOR_URL=http://pdf-extractor:8080
      - REDIS_URL=redis://redis:6379
    volumes:
      - db-data:/app/db
      - analytics-data:/tmp/analytics-data
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - coolify
    # Public routing via Coolify's Traefik (same pattern as every other
    # Coolify-managed app on this server - verified against a preserved
    # working config at /data/coolify/applications/*/docker-compose.yaml).
    # Cloudflare terminates the public TLS in front of this server and
    # forwards plain HTTP, so only an `http` entrypoint router is needed -
    # no cert resolver/https router here.
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.routers.http-0-perricheno-site.entryPoints=http
      - traefik.http.routers.http-0-perricheno-site.middlewares=gzip
      - traefik.http.routers.http-0-perricheno-site.rule=Host(`perricheno.com`) && PathPrefix(`/`)
      - traefik.http.routers.http-0-perricheno-site.service=http-0-perricheno-site
      - traefik.http.services.http-0-perricheno-site.loadbalancer.server.port=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-compiler:
        condition: service_started
      python-compiler:
        condition: service_started
      research-api:
        condition: service_started
      pdf-extractor:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: perricheno-worker:latest
    container_name: perricheno-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-perricheno}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres-db:5432/${POSTGRES_DB:-perricheno_db}?schema=public
      - NODE_ENV=production
      - R_COMPILER_URL=http://r-compiler:8000
      - PYTHON_COMPILER_URL=http://python-compiler:8000
      - RESEARCH_API_URL=http://research-api:8080
      - PDF_EXTRACTOR_URL=http://pdf-extractor:8080
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    # NO ports exposed - doesn't serve user HTTP traffic, only consumes the
    # queue. Healthcheck hits its own internal-only liveness endpoint.
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - coolify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-compiler:
        condition: service_started
      python-compiler:
        condition: service_started
      research-api:
        condition: service_started
      pdf-extractor:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    # --appendonly yes so queued-but-unprocessed jobs survive a Redis restart,
    # not just a web/worker container restart - matches the whole point of
    # Phase 6a (see docs/REVIEW.md).
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    # NO ports exposed - internal only via Docker network, same as
    # r-compiler/python-compiler/research-api.
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify
  r-compiler:
    build:
      context: ./r-compiler
      dockerfile: Dockerfile
    container_name: r-compiler
    restart: always
    volumes:
      - analytics-data:/tmp/analytics-data
    # NO ports exposed - internal only via Docker network
    healthcheck:
      test: [ "CMD", "Rscript", "-e", "tryCatch(readLines(url('http://127.0.0.1:8000/health')), error=function(e) quit(status=1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - coolify

  python-compiler:
    build:
      context: ./python-compiler
      dockerfile: Dockerfile
    container_name: python-compiler
    restart: always
    volumes:
      - analytics-data:/tmp/analytics-data
    # NO ports exposed - internal only via Docker network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - coolify

  research-api:
    build:
      context: ./research-api
      dockerfile: Dockerfile
    container_name: research-api
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - coolify

  pdf-extractor:
    build:
      context: ./pdf-extractor
      dockerfile: Dockerfile
    container_name: pdf-extractor
    restart: always
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - coolify

  ws-server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    container_name: ws-server
    restart: always
    ports:
      - "3035:1234"
    env_file:
      - .env
    environment:
      - WS_PORT=1234
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1234/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coolify

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    restart: always
    env_file:
      - .env
    ports:
      - "3033:3001"
    environment:
      - SITE_INTERNAL_URL=http://perricheno-site:3000
      - BOT_PORT=3001
    healthcheck:
      test: [ "CMD", "pgrep", "-f", "node dist/bot.js" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - coolify

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-perricheno}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-perricheno_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-perricheno} -d ${POSTGRES_DB:-perricheno_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  minio:
    image: minio/minio:latest
    container_name: minio-server
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-perricheno_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    # NO ports exposed - internal only via Docker network (see docs/REVIEW.md #6).
    # The app only ever reaches MinIO over the internal "minio" hostname; nothing
    # in src/ surfaces a public MinIO URL to a client. If the admin console is
    # needed from outside, use an SSH tunnel (`ssh -L 9001:localhost:9001 ...`)
    # or a separately-authenticated Cloudflare Tunnel route - not a bare port.
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - coolify

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - coolify
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER:-perricheno_admin} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required};
      /usr/bin/mc mb myminio/perricheno-bucket --ignore-existing;
      /usr/bin/mc anonymous set download myminio/perricheno-bucket;
      exit 0;
      "

volumes:
  db-data:
  postgres-data:
  minio-data:
  redis-data:
  analytics-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  # Coolify's own Traefik-facing network - NOT literally named "cloudflare"
  # despite Cloudflare proxying DNS in front of it. Confirmed against this
  # server's actual `docker network ls` and coolify-proxy's own attached
  # network (both "coolify"); the previous "cloudflare" name never existed
  # here and `docker compose up` would fail with "network cloudflare
  # declared as external, but could not be found" on a real deploy.
  coolify:
    external: true

