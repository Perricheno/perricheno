services:
  perricheno-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: perricheno-site:latest
    container_name: perricheno-site
    restart: always
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://perricheno:perricheno_pass@postgres-db:5432/perricheno_db?schema=public
      - NODE_ENV=production
      - R_COMPILER_URL=http://r-compiler:8000
      - PYTHON_COMPILER_URL=http://python-compiler:8000
      - RESEARCH_API_URL=http://research-api:8080
      - PDF_EXTRACTOR_URL=http://pdf-extractor:8080
      - WS_SERVER_INTERNAL_URL=ws://ws-server:1234
    volumes:
      - db-data:/app/db
      - analytics-data:/tmp/analytics-data
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - cloudflare
    depends_on:
      postgres:
        condition: service_healthy
      r-compiler:
        condition: service_started
      python-compiler:
        condition: service_started
      research-api:
        condition: service_started
      pdf-extractor:
        condition: service_started
  r-compiler:
    build:
      context: ./r-compiler
      dockerfile: Dockerfile
    container_name: r-compiler
    restart: always
    volumes:
      - analytics-data:/tmp/analytics-data
    # NO ports exposed - internal only via Docker network
    healthcheck:
      test: [ "CMD", "Rscript", "-e", "tryCatch(readLines(url('http://127.0.0.1:8000/health')), error=function(e) quit(status=1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cloudflare

  python-compiler:
    build:
      context: ./python-compiler
      dockerfile: Dockerfile
    container_name: python-compiler
    restart: always
    volumes:
      - analytics-data:/tmp/analytics-data
    # NO ports exposed - internal only via Docker network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - cloudflare

  research-api:
    build:
      context: ./research-api
      dockerfile: Dockerfile
    container_name: research-api
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - cloudflare

  pdf-extractor:
    build:
      context: ./pdf-extractor
      dockerfile: Dockerfile
    container_name: pdf-extractor
    restart: always
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - cloudflare

  ws-server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    container_name: ws-server
    restart: always
    ports:
      - "3035:1234"
    env_file:
      - .env
    environment:
      - WS_PORT=1234
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1234/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cloudflare

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    restart: always
    env_file:
      - .env
    ports:
      - "3033:3001"
    environment:
      - SITE_INTERNAL_URL=http://perricheno-site:3000
      - BOT_PORT=3001
    healthcheck:
      test: [ "CMD", "pgrep", "-f", "node dist/bot.js" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cloudflare

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=perricheno
      - POSTGRES_PASSWORD=perricheno_pass
      - POSTGRES_DB=perricheno_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perricheno -d perricheno_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudflare

  minio:
    image: minio/minio:latest
    container_name: minio-server
    restart: always
    environment:
      - MINIO_ROOT_USER=perricheno_admin
      - MINIO_ROOT_PASSWORD=perricheno_minio_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cloudflare

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - cloudflare
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 perricheno_admin perricheno_minio_pass;
      /usr/bin/mc mb myminio/perricheno-bucket --ignore-existing;
      /usr/bin/mc anonymous set download myminio/perricheno-bucket;
      exit 0;
      "

volumes:
  db-data:
  postgres-data:
  minio-data:
  analytics-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  cloudflare:
    external: true

