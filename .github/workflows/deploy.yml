name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  # ── Fast type-check before touching the server ────────────────────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  # ── SSH deploy (only runs when typecheck passes) ───────────────────────────
  deploy:
    name: Deploy via SSH
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LATEX_COMPILER_URL: ${{ secrets.LATEX_COMPILER_URL }}
          LATEX_COMPILER_KEY: ${{ secrets.LATEX_COMPILER_KEY }}
          CRYPTOCLOUD_API_KEY: ${{ secrets.CRYPTOCLOUD_API_KEY }}
          CRYPTOCLOUD_SHOP_ID: ${{ secrets.CRYPTOCLOUD_SHOP_ID }}
          CRYPTOCLOUD_SECRET: ${{ secrets.CRYPTOCLOUD_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_DOMAIN: ${{ secrets.WEBHOOK_DOMAIN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WS_JWT_SECRET: ${{ secrets.WS_JWT_SECRET }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: OPENAI_API_KEY,LATEX_COMPILER_URL,LATEX_COMPILER_KEY,CRYPTOCLOUD_API_KEY,CRYPTOCLOUD_SHOP_ID,CRYPTOCLOUD_SECRET,TELEGRAM_BOT_TOKEN,WEBHOOK_DOMAIN,WEBHOOK_SECRET,WS_JWT_SECRET,NEXT_PUBLIC_WS_URL,MINIO_ENDPOINT,MINIO_PORT,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,MINIO_BUCKET_NAME
          script: |
            cd ${{ secrets.SERVER_PATH }}

            # Helper: only set/update if value is non-empty
            update_env() {
              local key=$1
              local value=$2
              if [ -n "$value" ]; then
                if grep -q "^$key=" .env; then
                  awk -v k="$key" -v v="$value" -F= 'BEGIN{OFS="="} $1==k {$2=v} 1' .env > .env.tmp && mv .env.tmp .env
                else
                  echo "$key=$value" >> .env
                fi
              fi
            }

            update_env "NODE_ENV" "production"
            update_env "OPENAI_API_KEY" "$OPENAI_API_KEY"
            update_env "LATEX_COMPILER_URL" "$LATEX_COMPILER_URL"
            update_env "LATEX_COMPILER_KEY" "$LATEX_COMPILER_KEY"
            update_env "CRYPTOCLOUD_API_KEY" "$CRYPTOCLOUD_API_KEY"
            update_env "CRYPTOCLOUD_SHOP_ID" "$CRYPTOCLOUD_SHOP_ID"
            update_env "CRYPTOCLOUD_SECRET" "$CRYPTOCLOUD_SECRET"
            update_env "TELEGRAM_BOT_TOKEN" "$TELEGRAM_BOT_TOKEN"
            update_env "WEBHOOK_DOMAIN" "$WEBHOOK_DOMAIN"
            update_env "WEBHOOK_SECRET" "$WEBHOOK_SECRET"
            update_env "WS_JWT_SECRET" "$WS_JWT_SECRET"
            update_env "NEXT_PUBLIC_WS_URL" "$NEXT_PUBLIC_WS_URL"
            update_env "MINIO_ENDPOINT" "$MINIO_ENDPOINT"
            update_env "MINIO_PORT" "$MINIO_PORT"
            update_env "MINIO_ACCESS_KEY" "$MINIO_ACCESS_KEY"
            update_env "MINIO_SECRET_KEY" "$MINIO_SECRET_KEY"
            update_env "MINIO_BUCKET_NAME" "$MINIO_BUCKET_NAME"
            update_env "SITE_INTERNAL_URL" "http://perricheno-site:3000"
            update_env "BOT_CONTAINER_URL" "http://telegram-bot:3001"

            echo "🧹 Syncing repository..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            bash deploy.sh
