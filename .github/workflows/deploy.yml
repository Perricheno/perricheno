name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LATEX_COMPILER_URL: ${{ secrets.LATEX_COMPILER_URL }}
          LATEX_COMPILER_KEY: ${{ secrets.LATEX_COMPILER_KEY }}
          CRYPTOCLOUD_API_KEY: ${{ secrets.CRYPTOCLOUD_API_KEY }}
          CRYPTOCLOUD_SHOP_ID: ${{ secrets.CRYPTOCLOUD_SHOP_ID }}
          CRYPTOCLOUD_SECRET: ${{ secrets.CRYPTOCLOUD_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_DOMAIN: ${{ secrets.WEBHOOK_DOMAIN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: OPENAI_API_KEY,LATEX_COMPILER_URL,LATEX_COMPILER_KEY,CRYPTOCLOUD_API_KEY,CRYPTOCLOUD_SHOP_ID,CRYPTOCLOUD_SECRET,TELEGRAM_BOT_TOKEN,WEBHOOK_DOMAIN,WEBHOOK_SECRET
          script: |
            cd ${{ secrets.SERVER_PATH }}
            
            # Helper function: Only set or append if the value is not empty
            update_env() {
              local key=$1
              local value=$2
              if [ -n "$value" ]; then
                if grep -q "^$key=" .env; then
                  # Use awk to safely replace the value, avoiding sed delimiter issues
                  awk -v k="$key" -v v="$value" -F= 'BEGIN{OFS="="} $1==k {$2=v} 1' .env > .env.tmp && mv .env.tmp .env
                else
                  echo "$key=$value" >> .env
                fi
              fi
            }

            # Only update if the secrets are actually provided in GitHub
            update_env "NODE_ENV" "production"
            update_env "OPENAI_API_KEY" "$OPENAI_API_KEY"
            update_env "LATEX_COMPILER_URL" "$LATEX_COMPILER_URL"
            update_env "LATEX_COMPILER_KEY" "$LATEX_COMPILER_KEY"
            update_env "CRYPTOCLOUD_API_KEY" "$CRYPTOCLOUD_API_KEY"
            update_env "CRYPTOCLOUD_SHOP_ID" "$CRYPTOCLOUD_SHOP_ID"
            update_env "CRYPTOCLOUD_SECRET" "$CRYPTOCLOUD_SECRET"
            update_env "TELEGRAM_BOT_TOKEN" "$TELEGRAM_BOT_TOKEN"
            update_env "WEBHOOK_DOMAIN" "$WEBHOOK_DOMAIN"
            update_env "WEBHOOK_SECRET" "$WEBHOOK_SECRET"
            
            # Ensure static internal domains are set
            update_env "SITE_INTERNAL_URL" "http://perricheno-site:3000"
            update_env "BOT_CONTAINER_URL" "http://telegram-bot:3001"
            
            bash deploy.sh
